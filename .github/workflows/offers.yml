name: Angebote aktualisieren

# Holt automatisch frische Angebote und speichert sie in offers.json.
# Läuft täglich früh am Morgen (sowie samstags abends für die neue Woche) und lässt sich von Hand starten.
on:
  schedule:
    - cron: '30 4 * * *'
    - cron: '0 16 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: angebote
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Angebote holen (ca. 10 Minuten, mit Pausen)
        run: node refresh-offers.js
      - name: offers.json speichern
        run: |
          git config user.name "Angebote-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add offers.json
          git diff --cached --quiet || (git commit -m "Angebote aktualisiert" && git pull --rebase origin main && git push)
