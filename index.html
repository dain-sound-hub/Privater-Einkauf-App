<script>try{var t=(JSON.parse(localStorage.getItem("einkauf.v2")||"{}").set||{}).theme;if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{--bg:#eef3f0;--bg2:#e4efe9;--card:#ffffff;--ink:#14201a;--mute:#66756d;--line:#e2eae5;--acc:#14a56b;--acc-d:#0b7a4d;--acc-l:#3ed49a;--acc2:#e1f6ec;--warn:#c25e00;--warn2:#fff0dd;--blue:#2b6cc4;--blue2:#e6f0fd;--vio:#7a45c4;--vio2:#f1e9fc;--red:#d23a2f;--glow:rgba(20,165,107,.35);
--sh1:0 1px 2px rgba(15,40,28,.08),0 4px 12px rgba(15,40,28,.08);--sh2:0 2px 4px rgba(15,40,28,.08),0 14px 34px rgba(15,40,28,.16);--hi:inset 0 1px 0 rgba(255,255,255,.7);--r:20px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1411;--bg2:#101a15;--card:#18211c;--ink:#e8efeb;--mute:#93a49b;--line:#26332c;--acc:#35c98b;--acc-d:#1f9a69;--acc-l:#6ee7b0;--acc2:#15322a;--warn:#f5a45c;--warn2:#352613;--blue:#86b6f4;--blue2:#172a45;--vio:#c3a0ee;--vio2:#2b2040;--red:#f58a82;--glow:rgba(53,201,139,.3);--sh1:0 1px 2px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);--sh2:0 2px 4px rgba(0,0,0,.4),0 16px 36px rgba(0,0,0,.5);--hi:inset 0 1px 0 rgba(255,255,255,.06)}}
:root[data-theme="dark"]{--bg:#0d1411;--bg2:#101a15;--card:#18211c;--ink:#e8efeb;--mute:#93a49b;--line:#26332c;--acc:#35c98b;--acc-d:#1f9a69;--acc-l:#6ee7b0;--acc2:#15322a;--warn:#f5a45c;--warn2:#352613;--blue:#86b6f4;--blue2:#172a45;--vio:#c3a0ee;--vio2:#2b2040;--red:#f58a82;--glow:rgba(53,201,139,.3);--sh1:0 1px 2px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);--sh2:0 2px 4px rgba(0,0,0,.4),0 16px 36px rgba(0,0,0,.5);--hi:inset 0 1px 0 rgba(255,255,255,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(900px 500px at 85% -10%,var(--bg2),transparent 70%),radial-gradient(700px 400px at -10% 30%,var(--bg2),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:170px}
.wrap{max-width:760px;margin:auto;padding:0 14px}
button,input,select{font:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}

/* Kopfbereich */
header{background:linear-gradient(180deg,rgba(6,28,20,.62),rgba(6,28,20,.32) 55%,rgba(6,28,20,.62)),url("header.jpg") center 60%/cover,#0e3b2e;color:#fff7e6;padding:10px 0 8px;border-radius:0 0 24px 24px;box-shadow:0 10px 24px rgba(10,40,30,.3);position:relative;overflow:hidden;overflow:clip}
.awning{display:none}
header .top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
header h1{margin:0;line-height:1}
.meta{margin-top:6px;font-size:12px;color:rgba(255,247,230,.9);text-shadow:0 1px 3px rgba(0,0,0,.5);position:relative;display:flex;flex-wrap:wrap;gap:2px 8px}
.rstat{display:inline}.rstat .bar{display:block;margin-top:5px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.35);overflow:hidden;min-width:200px}.bar i{display:block;height:100%;background:#fff;width:0;transition:width .3s;border-radius:6px}
header::after{display:none}
.rbtn{background:linear-gradient(#fffdf6,#f5ebd0);color:#12604a;border:0;border-radius:999px;padding:8px 15px;font-size:14px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.14),0 10px 20px rgba(0,0,0,.18),var(--hi);white-space:nowrap;transition:transform .12s,box-shadow .12s}
.rbtn:hover{transform:translateY(-2px);box-shadow:0 8px 0 rgba(0,0,0,.14),0 14px 26px rgba(0,0,0,.22)}.rbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.14),0 4px 10px rgba(0,0,0,.18)}.rbtn[disabled]{opacity:.85;transform:none}
main{padding-top:10px}

/* Navigation */
nav.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));z-index:10;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh2),var(--hi);padding:5px}
nav.bottom div{display:flex}
nav.bottom button{flex:1;min-width:0;border:0;background:none;color:var(--mute);padding:8px 1px 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:20px;transition:all .15s}
nav.bottom button span{font-size:22px;line-height:1.1;transition:transform .15s}
nav.bottom button:hover{background:var(--acc2);color:var(--acc-d)}nav.bottom button:hover span{transform:translateY(-2px) scale(1.12)}
nav.bottom button.on{background:linear-gradient(var(--acc-l),var(--acc));color:#fff;box-shadow:0 6px 14px var(--glow),var(--hi);font-weight:700}

/* Karten */
.card{background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--sh1),var(--hi);margin-bottom:10px;border:1px solid var(--line);transition:transform .18s,box-shadow .18s}
.card.tight{padding:4px 12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.grid .card{margin:0}
.offer:hover,.help:hover{transform:translateY(-4px);box-shadow:var(--sh2),var(--hi)}
.ohead{display:flex;gap:12px;align-items:flex-start}
h2{font-size:13px;margin:16px 4px 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.7px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}h2:first-child{margin-top:4px}h3{margin:0;font-size:16px;line-height:1.25}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row.nowrap{flex-wrap:nowrap;align-items:flex-start}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:13px}.small{font-size:13px}.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Bilder */
.thumb{width:76px;height:76px;flex:none;border-radius:18px;background:linear-gradient(145deg,var(--acc2),var(--bg2));position:relative;overflow:hidden;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line),0 6px 14px rgba(15,40,28,.14);transition:transform .2s}
.thumb .em{font-size:36px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:4px}
.thumb.sm{width:50px;height:50px;border-radius:14px}.thumb.sm .em{font-size:26px}
.card:hover>.ohead .thumb,.item:hover .thumb{transform:scale(1.07) rotate(-2deg)}

/* Eingabe, Buttons */
input,select,textarea{color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;outline:none;min-width:0;box-shadow:inset 0 2px 4px rgba(15,40,28,.06);transition:border-color .15s,box-shadow .15s}
input:hover,select:hover{border-color:var(--acc-l)}input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--glow)}
.add{display:flex;gap:8px;margin-bottom:10px}.add input{flex:1}
a.btn{text-decoration:none;display:inline-block}
.btn{border:0;border-radius:16px;padding:12px 17px;font-weight:800;background:linear-gradient(var(--card),var(--acc2));color:var(--acc-d);box-shadow:0 4px 0 var(--line),0 8px 14px rgba(15,40,28,.1),var(--hi);transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 6px 0 var(--line),0 12px 20px rgba(15,40,28,.14),var(--hi)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line),0 3px 6px rgba(15,40,28,.1)}
.btn.pri{background:linear-gradient(var(--acc-l),var(--acc));color:#fff;box-shadow:0 4px 0 var(--acc-d),0 10px 18px var(--glow),var(--hi)}.btn.pri:hover{box-shadow:0 6px 0 var(--acc-d),0 14px 24px var(--glow)}.btn.pri:active{box-shadow:0 1px 0 var(--acc-d),0 3px 8px var(--glow)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:12px;box-shadow:0 3px 0 var(--line),0 5px 10px rgba(15,40,28,.08),var(--hi)}
.btn.danger{background:linear-gradient(#fff0ee,#fdd9d5);color:var(--red);box-shadow:0 4px 0 #f3b9b3}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;box-shadow:var(--sh1);transition:transform .12s,box-shadow .12s,background .12s}
.chip:hover{transform:translateY(-3px) scale(1.03);box-shadow:var(--sh2);background:var(--acc2)}.chip:active{transform:translateY(0)}
.seg{display:flex;background:var(--card);border-radius:18px;padding:5px;gap:3px;margin-bottom:14px;box-shadow:var(--sh1),var(--hi);overflow-x:auto;border:1px solid var(--line);scrollbar-width:none}.seg button{flex:1;border:0;background:none;padding:10px 12px;border-radius:13px;font-size:14px;color:var(--mute);white-space:nowrap;transition:all .15s}
.seg button:hover{background:var(--acc2);color:var(--acc-d)}.seg button.on{background:linear-gradient(var(--acc-l),var(--acc));color:#fff;font-weight:800;box-shadow:0 5px 12px var(--glow)}

/* Listenzeilen */
.item{display:flex;gap:11px;align-items:center;padding:11px 6px;margin:0 -6px;border-bottom:1px solid var(--line);border-radius:14px;transition:background .15s,transform .15s}.item:last-child{border-bottom:0}
.item:hover{background:var(--acc2);transform:translateX(3px)}
.chk{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);flex:none;background:var(--card);display:grid;place-items:center;color:#fff;font-size:16px;padding:0;box-shadow:inset 0 2px 3px rgba(15,40,28,.1);transition:all .15s}
.chk:hover{border-color:var(--acc);transform:scale(1.12)}.chk.on{background:linear-gradient(var(--acc-l),var(--acc));border-color:var(--acc);box-shadow:0 4px 10px var(--glow)}
.item.done .nm{text-decoration:line-through;color:var(--mute)}.nm{font-weight:700;cursor:pointer}.nm:hover{color:var(--acc-d)}
.ico{border:0;background:none;font-size:21px;padding:9px 10px;min-width:42px;min-height:42px;opacity:.4;filter:grayscale(1);border-radius:12px;transition:all .15s}.ico:hover{opacity:1;filter:none;background:var(--card);transform:scale(1.2);box-shadow:var(--sh1)}.ico.on{opacity:1;filter:none;background:var(--warn2);box-shadow:0 0 0 2px var(--warn) inset}

/* Kennzeichen */
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:9px;padding:3px 9px;background:var(--bg2);color:var(--mute)}.t-new{background:var(--vio2);color:var(--vio)}.t-watch{background:var(--warn2);color:var(--warn)}.t-stock{background:var(--blue2);color:var(--blue)}.t-ok{background:var(--acc2);color:var(--acc-d)}.t-warn{background:var(--warn2);color:var(--warn)}.t-tier{background:var(--bg2);color:var(--ink)}
.pct{background:linear-gradient(var(--acc-l),var(--acc));color:#fff;border-radius:11px;padding:3px 10px;font-weight:900;font-size:14px;white-space:nowrap;box-shadow:0 4px 10px var(--glow);flex:none}.pct.dub{background:linear-gradient(#ffb766,var(--warn));box-shadow:none}
.price{font-size:26px;font-weight:900;letter-spacing:-.6px}.old{color:var(--mute);text-decoration:line-through;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;box-shadow:0 0 0 3px rgba(255,255,255,.4)}.tA{background:#14a56b}.tB{background:#e0a100}.tC{background:#e0663a}.tD{background:#7a45c4}
.banner{background:var(--warn2);color:var(--warn);border-radius:16px;padding:10px 12px;margin-bottom:10px;font-size:13.5px;box-shadow:var(--sh1)}.banner.info{background:var(--blue2);color:var(--blue)}
.help ol{margin:8px 0 12px;padding-left:20px}.help li{margin:6px 0}
.empty{text-align:center;color:var(--mute);padding:30px 10px}.empty big{font-size:46px;display:block;margin-bottom:6px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.15))}
.detail{margin-top:8px;background:var(--bg);border-radius:14px;padding:11px;font-size:13px;box-shadow:inset 0 2px 5px rgba(15,40,28,.08)}.detail table{width:100%;border-collapse:collapse}.detail td{padding:3px 4px}.detail td:last-child{text-align:right}
a{color:var(--blue);font-weight:600}a:hover{text-decoration:underline}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
details summary{cursor:pointer;padding:6px 0;border-radius:10px}details summary:hover{color:var(--acc-d)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}.chip.arrow{background:var(--acc2);color:var(--acc-d);font-weight:700;padding:5px 12px;font-size:13px}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));z-index:11;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh2),var(--hi);padding:6px}
.dockrow{display:flex;gap:6px}.dockrow input{flex:1;padding:9px 12px;border-radius:14px;font-size:15px}.dockrow .btn{padding:8px 13px;border-radius:14px;box-shadow:0 3px 0 var(--line)}.dockrow .btn.pri{box-shadow:0 3px 0 var(--acc-d)}
.fb{font-size:13px;padding:3px 6px 7px;color:var(--ink);line-height:1.3}.fb.warn{color:var(--warn)}.fb[hidden]{display:none}.lnk{border:0;background:none;color:var(--blue);font-weight:700;text-decoration:underline;padding:0 2px;font-size:13px}
.bdg{position:absolute;top:-4px;right:-10px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;line-height:1;padding:3px 5px;font-weight:800}nav.bottom button span{position:relative}
.item.flash{animation:fl 2.2s ease-out}@keyframes fl{0%,35%{background:var(--acc2);box-shadow:0 0 0 3px var(--glow)}100%{background:transparent;box-shadow:none}}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}.chips.scroll::-webkit-scrollbar{display:none}.chips.scroll .chip{flex:none}
.seg3 button{padding:10px 4px;font-size:13px;min-width:0}.seg3 button small{display:block;font-size:11px;margin:0}
.seg small{opacity:.75;font-weight:600;margin-left:2px}
button.info{border:0;background:var(--blue2);color:var(--blue);width:26px;height:26px;border-radius:50%;font-weight:800;font-style:italic;font-family:Georgia,serif;font-size:15px;padding:0;line-height:26px;text-align:center;box-shadow:0 2px 0 var(--line);transition:transform .12s}button.info:hover{transform:scale(1.15)}
.nxt{color:var(--warn);margin-top:3px;font-weight:600}.chip.due{border-color:var(--warn);background:var(--warn2);color:var(--warn);font-weight:700}
details.later summary{cursor:pointer;font-weight:700;padding:10px 0}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}
.sheetbox{background:var(--card);width:min(640px,100%);max-height:80vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.35);animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheetbox h4{margin:14px 0 4px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;font-size:12px}.cmp td{vertical-align:top}.cmp tr.win td{background:var(--acc2)}.cmp td:first-child{white-space:nowrap;font-weight:600}
.bqs{display:block;width:100%;text-align:left;margin:10px 0 0;padding:10px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;line-height:1.35}.bqs:empty{display:none}
.nstat{font-size:13px;margin:0 0 10px;padding:9px 12px;background:var(--card);border-radius:14px;border:1px solid var(--line);box-shadow:var(--sh1)}
.sug{display:flex;flex-direction:column;gap:4px;padding:2px 2px 6px}.sug[hidden]{display:none}.sugrow{display:flex;align-items:center;gap:10px;border:0;background:var(--bg);border-radius:14px;padding:8px 12px;text-align:left;color:var(--ink);transition:background .12s,transform .12s;width:100%}.sugrow:hover,.sugrow:active{background:var(--acc2);transform:translateX(3px)}.sugrow b{display:block;font-weight:700}.sugrow small{display:block;color:var(--mute);font-size:12px}.sugrow .em{font-size:22px}.sugrow .plus{color:var(--acc-d);font-weight:800;font-size:22px}.dock.sugon #fb{display:none}
.chip.main{border-color:var(--acc);font-weight:600}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.hs{display:flex;gap:14px;overflow-x:auto;padding:4px 14px 18px;scroll-snap-type:x proximity;margin:0 -14px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}.hs .card{flex:0 0 82%;max-width:320px;margin:0;scroll-snap-align:start}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* Daumen-Komfort: größere Tippflächen auf Touchgeräten (mind. ca. 40 px) */
@media (pointer:coarse){
.btn.sm{min-height:40px;padding:9px 15px}.rbtn{min-height:42px}.chip{min-height:40px}.chip.arrow{padding:8px 14px}
.chk{width:36px;height:36px}button.info{width:36px;height:36px;line-height:36px;font-size:17px}
.nm{padding:8px 0;min-height:36px}.lnk{padding:10px 6px;display:inline-block}a{display:inline-block;padding:9px 3px}
summary{min-height:42px;display:flex;align-items:center}.sugrow{min-height:48px}.seg button{min-height:42px}
.dockrow .btn{min-height:44px}.dockrow input{min-height:44px}
}
/* Kompakte Liste: eine Zeile pro Artikel, Antippen klappt die Einzelheiten auf */
.lhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:2px 4px 8px}.lhead b{font-size:21px;letter-spacing:-.2px}.lhead span{color:var(--mute);font-size:13px}
h2.sh{margin:14px 4px 6px;font-size:13px}
.card.main{border:2px solid color-mix(in srgb,var(--acc) 40%,var(--line));box-shadow:0 8px 22px var(--glow),var(--hi)}
.crow{display:flex;align-items:center;gap:8px;min-height:46px;padding:4px 0;border-bottom:1px solid var(--line);cursor:pointer}
.card .crow:last-of-type{border-bottom:0}
.crow .chk{width:30px;height:30px;flex:none}
.crow .em{font-size:20px;width:26px;text-align:center;flex:none}
.crow .nm{flex:1;min-width:0;padding:0;min-height:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.crow .pr{flex:none;text-align:right;line-height:1.15;font-size:14px}.crow .pr small{display:block;color:var(--mute);font-size:11.5px;font-weight:600}
.crow .pc{color:var(--acc-d);font-weight:800}.crow .pc.dub{color:var(--warn)}
.crow .chev{flex:none;border:0;background:none;color:var(--mute);font-size:13px;width:26px;height:34px;padding:0;transition:transform .15s}
.crow.open .chev{transform:rotate(180deg)}
.crow.done .nm{text-decoration:line-through;color:var(--mute)}
.crow.flash{animation:fl 2.2s ease-out}
.cdet{background:var(--bg);border-radius:14px;padding:11px;margin:2px 0 8px;font-size:13px;box-shadow:inset 0 2px 5px rgba(15,40,28,.08)}.cdet table{width:100%;border-collapse:collapse}.cdet td{padding:3px 4px}.cdet td:last-child{text-align:right}
